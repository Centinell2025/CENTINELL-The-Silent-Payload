name: Assemble Silent Payload student ZIP
on:
  push:
    paths:
      - '.github/workflows/build-silent-payload-release.yml'
      - 'tools/build_student_bundle.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-student-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm all ten sector scenarios follow evidence schema
        run: python3 BUSINESS_APPLICATIONS/tools/inspect_events.py --validate-all
      - name: Build evidence manifest and self-contained student ZIP
        run: python3 tools/build_student_bundle.py --write
      - name: Run evidence and student reproducibility tests
        run: |
          python3 tools/verify_case.py
          python3 tests/test_training_content.py
          python3 tools/build_student_bundle.py --check
      - name: Commit generated student files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/MANIFEST.sha256 downloads/CENTINELL-The-Silent-Payload-STUDENT.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated main case manifest and Sherlock student download"
            git push origin HEAD:main
          fi
